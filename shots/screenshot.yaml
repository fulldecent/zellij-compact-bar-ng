# ModeUpdate supplies the session theme, Styling::from(default_palette()).
# 140 columns fits Zellij, the session, NORMAL, three named ribbons, the
# plus button, two spaces, and the full normal key hints.
name: screenshot
plugin: ../target/wasm32-wasip1/release/plugin.wasm
geometry:
  rows: 1
  cols: 140
steps:
  - action: grant_permissions
  - action: mode_update
    mode: normal
    session: demo
  - action: tab_update
    tabs:
      - name: "Tab #1"
        active: false
        tiled: 1
      - name: "Tab #2"
        active: true
        tiled: 2
      - name: "Tab #3"
        active: false
        tiled: 1
